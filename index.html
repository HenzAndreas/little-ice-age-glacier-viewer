<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Little Ice Age glaciers — European Alps</title>

    <meta name="theme-color" content="#10141c" />

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>

    <!-- The panel and, behind it, the frosted pane it sits on. The pane is a
         sibling rather than a child because it overhangs the panel on every side
         (see #panel-glass in style.css) and the panel is a scroll container: as a
         child it would slide out from under its own contents. The shell clips the
         overhang and owns the drop shadow. -->
    <div id="panel-shell">
      <div id="panel-glass" aria-hidden="true"></div>
      <aside id="panel">
        <header>
          <div>
            <h1 id="title">
              Little Ice Age glaciers
            </h1>
            <p id="subtitle">Reconstructed Little Ice Age glacier geometry across the Alps</p>
            <p id="paper">
              <a href="https://doi.org/10.5194/tc-19-5913-2025" target="_blank" rel="noopener"
                 title="Henz, A., Reinthaler, J., Nussbaumer, S. U., Leger, T. P. M., Kamleitner, S., Jouvet, G., & Vieli, A. (2025). Alps-wide high-resolution 3D modelling reconstruction of glacier geometry and climatic conditions for the Little Ice Age. The Cryosphere, 19(11), 5913–5937. https://doi.org/10.5194/tc-19-5913-2025">Henz et al. (2025), The Cryosphere</a>
            </p>
          </div>
          <!-- Collapses everything below the title. The panel covers most of a
               phone screen, so there it opens collapsed — see js/app.js. -->
          <!-- Replays the intro tour (js/tour.js), which opens by itself on a first visit. -->
          <button type="button" id="tour-open" title="Show the intro tour" aria-label="Show the intro tour">?</button>
          <button type="button" id="panel-toggle" aria-expanded="true" aria-controls="panel-body">
            <span class="chevron" aria-hidden="true"
                  ><svg viewBox="0 0 12 12" width="12" height="12" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M2.5 4.5 6 8 9.5 4.5" /></svg
                ></span>
          </button>
        </header>

        <div id="panel-body">

          <!-- The choice everything below follows: the reconstructed glaciers
               (LIA terrain in 3D, thickness, surface relief) or today's terrain
               and map without them. Wired in js/app.js. -->
          <section class="control" id="period-row">
            <label id="period-label">Glacier state</label>
            <!-- One switch rather than two buttons: the knob slides between the
                 two states, and clicking either name or the track flips it. -->
            <button type="button" id="period" class="period-switch" role="switch"
                    aria-checked="false" aria-labelledby="period-label">
              <span class="period-name" data-value="lia">Little Ice Age</span>
              <span class="period-track" aria-hidden="true"><span class="period-knob"></span></span>
              <span class="period-name" data-value="today">Today</span>
            </button>
            <p id="period-note"></p>
          </section>

          <!-- Only meaningful on the LIA surface, so hidden as a block under "Today". -->
          <div id="lia-controls">

          <!-- Everything that describes a raster layer. Hidden as a block when
               the catalog cannot be reached, since none of it means anything then. -->
          <div id="raster-controls">
            <section class="control">
              <label for="product">Product</label>
              <div id="product" class="segmented" role="radiogroup" aria-label="Product"></div>
            </section>

            <!-- The measurement, or one of the two QA rasters the store
                 publishes beside it. Hidden unless the catalog carries more
                 than one, since a store built before the QA rasters offers
                 no choice at all — see js/rasters.js. -->
            <section class="control" id="quantity-row" hidden>
              <label for="quantity">Layer</label>
              <div id="quantity" class="segmented" role="radiogroup" aria-label="Layer"></div>
            </section>

            <section class="control">
              <label for="opacity">Layer opacity <output id="opacity-value">100%</output></label>
              <input type="range" id="opacity" min="0" max="100" value="100" step="1" />
            </section>

            <section id="legend" class="control">
              <div class="control-head">
                <label>Scale</label>
                <!-- Colour-map credit, appended by js/rasters.js: which map it is
                     depends on the layer, so the button is rebuilt when it changes. -->
                <span id="legend-credit"></span>
              </div>
              <div id="legend-bar"></div>
              <div id="legend-labels"><span id="legend-min"></span><span id="legend-max"></span></div>
              <!-- A false-colour layer has no ramp: three channels, each carrying
                   a different measurement. Filled by js/rasters.js, which hides
                   the bar and its labels whenever it fills this. -->
              <div id="legend-channels" hidden></div>
            </section>

            <!-- What the selected layer is. Sits under the ramp rather than in a
                 footer: it describes the thing the controls above just chose. -->
            <p id="layer-info"></p>
          </div>

          <!-- The LIA surface relief is the hillshade of the 3D terrain (Map options),
               which carries the LIA surface in this state. The separate 2D patch
               relief (js/lia-surface.js) is no longer wired: MapLibre's hillshade
               ignores alpha and drew cliffs at every glacier margin. -->

          </div>

          <!-- Outside #lia-controls: the outlines mean something under either
               glacier state. Click inside a glacier for its attributes. -->
          <section class="control checkbox" id="lia-outlines-row">
            <input type="checkbox" id="lia-outlines" checked />
            <label for="lia-outlines">LIA glacier outlines</label>
          </section>

          <hr />

          <section class="control" id="inventories-section" hidden>
            <!-- Starts collapsed: an overlay that is off by default does not
                 need to take up the panel before anyone asks for them. -->
            <button type="button" id="inventories-toggle" aria-expanded="false"
                    aria-controls="inventories">
              <span>Glacier inventories</span><span class="chevron up" aria-hidden="true"
                    ><svg viewBox="0 0 12 12" width="12" height="12" fill="none"
                          stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"><path d="M2.5 4.5 6 8 9.5 4.5" /></svg
                  ></span>
            </button>
            <div id="inventories" hidden></div>
          </section>

          <!-- Hidden along with the inventories above it, so a page with no
               inventory index does not show two rules in a row. -->
          <hr id="inventories-rule" />

          <section class="control" id="extras-section">
            <!-- Same reasoning as the inventories above: the optional layers are
                 off on arrival; World Imagery and its labels are the defaults. -->
            <button type="button" id="extras-toggle" aria-expanded="false" aria-controls="extras">
              <span>Map options</span><span class="chevron up" aria-hidden="true"
                    ><svg viewBox="0 0 12 12" width="12" height="12" fill="none"
                          stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"><path d="M2.5 4.5 6 8 9.5 4.5" /></svg
                  ></span>
            </button>
            <div id="extras" hidden>
              <section class="control">
                <div id="basemap-style" class="segmented" role="radiogroup" aria-label="Basemap"></div>
              </section>

              <section class="control checkbox" id="hillshade-row">
                <input type="checkbox" id="hillshade" checked />
                <label for="hillshade">Hillshade</label>
              </section>
              <section class="control" id="hillshade-strength-row">
                <label for="hillshade-strength">
                  Hillshade strength <output id="hillshade-strength-value">30%</output>
                </label>
                <input type="range" id="hillshade-strength" min="0" max="100" value="30" step="1" />
              </section>

              <section class="control checkbox">
                <input type="checkbox" id="basemap" checked />
                <label for="basemap">Basemap labels</label>
              </section>
            </div>
          </section>
        </div>
      </aside>
    </div>

    <div id="status" hidden></div>

    <!-- Every library, pinned. An import map has to be parsed before the first
         module loads, so this cannot move below the modules.

         maplibre-gl is ESM-only from v6; its bundle imports a shared chunk and,
         at map creation, a worker file, both beside it. pmtiles imports fflate
         bare, hence the fourth entry.

         Nothing on the page reads a COG today, but js/cog-rgb.js is still wired
         up and `lerc` is what it imports when asked for a tile. It is mapped to
         the package's own file rather than the CDN that builds the reader
         (`?external=lerc` on cogReaderUrl in js/config.js; change the two
         together): esm.sh rewrites `globalThis.process` to a Node polyfill,
         under which lerc's emscripten loader decides it is running in Node and
         every decode rejects. -->
    <script type="importmap">
      {
        "imports": {
          "maplibre-gl": "https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.mjs",
          "pmtiles": "https://unpkg.com/pmtiles@4.5.0/dist/esm/index.js",
          "fflate": "https://unpkg.com/fflate@0.8.3/esm/browser.js",
          "@protomaps/basemaps": "https://unpkg.com/@protomaps/basemaps@5.7.2/dist/esm/index.js",
          "lerc": "https://cdn.jsdelivr.net/npm/lerc@4.2.0/LercDecode.es.js"
        }
      }
    </script>

    <!-- The globals the UMD builds used to create. The js/ modules read these
         rather than importing the packages, which is what lets the tests hand
         them a fake. Module scripts run in document order, so this is set
         before js/app.js. -->
    <script type="module">
      import * as maplibregl from "maplibre-gl";
      import * as pmtiles from "pmtiles";
      import * as basemaps from "@protomaps/basemaps";
      Object.assign(globalThis, { maplibregl, pmtiles, basemaps });
    </script>
    <!-- Optional per-deployment overrides; must run before the modules do. -->
    <script src="site-config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
