# Publishes the viewer to GitHub Pages. The page code comes from the repository;
# the PMTiles archives come from a GitHub Release (they are build outputs, kept
# out of Git history) and are copied to tiles/, the same path the local server
# mounts local-data/ at, so no URL in the code changes between local and online.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The release holding the archives. Bump it when the data is rebuilt.
  DATA_RELEASE: data-v1

jobs:
  # The page's regression tests (jsdom, no browser and no data needed). A
  # failure stops the deploy, so a broken page is never published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/tiles
          cp -r index.html style.css site-config.js js data favicon _site/
          touch _site/.nojekyll

      - name: Fetch the data archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$DATA_RELEASE" --pattern '*.pmtiles' --dir _site/tiles

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
